# Render Blueprint — deploys Skinfinity Lounge as a static site.
# Docs: https://render.com/docs/blueprint-spec
#
# With this file in the repo, Render's "New > Blueprint" flow will auto-configure
# everything below. No build step is needed — the site is plain HTML/CSS/JS.
services:
  - type: web
    name: skinfinity-lounge
    runtime: static
    buildCommand: "echo 'No build step needed — static site'"
    staticPublishPath: .
